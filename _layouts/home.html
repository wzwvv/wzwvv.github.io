---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="home-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <main id="main-content" class="zw-main" role="main">
      {{ content }}
    </main>

    {% include scripts.html %}
    <script>
      (function () {
        var links = document.querySelectorAll('.zw-nav-link');
        var sections = [];
        links.forEach(function (link) {
          var target = document.querySelector(link.getAttribute('href'));
          if (target) sections.push({ link: link, target: target });
        });

        if ('IntersectionObserver' in window) {
          var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (!entry.isIntersecting) return;
              links.forEach(function (link) { link.removeAttribute('aria-current'); });
              var current = sections.find(function (item) { return item.target === entry.target; });
              if (current) current.link.setAttribute('aria-current', 'page');
            });
          }, { rootMargin: '-25% 0px -65% 0px', threshold: 0 });
          sections.forEach(function (item) { observer.observe(item.target); });
        }
      })();
    </script>
  </body>
</html>

name: Update Profile Metrics

on:
  workflow_dispatch:
  page_build:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt
      - name: Collect Scholar, GitHub, and Zenodo metrics
        working-directory: google_scholar_crawler
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: fjlXqvQAAAAJ
          GITHUB_USERNAME: wzwvv
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZENODO_RECORD_ID: "19333249"
          METRICS_CACHE_URL: https://raw.githubusercontent.com/${{ github.repository }}/google-scholar-stats/profile_metrics.json
          SCHOLAR_CACHE_URL: https://raw.githubusercontent.com/${{ github.repository }}/google-scholar-stats/gs_data.json
      - name: Publish metrics data
        working-directory: google_scholar_crawler/results
        run: |
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add *.json
          git commit -m "Update profile metrics"
          git push "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
